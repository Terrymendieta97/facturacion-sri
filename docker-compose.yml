version: "3.8"

services:
  # Backend API REST SRI
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: lojafac-backend
    restart: always
    environment:
      - NODE_ENV=production
      - PORT=4000
      - TZ=America/Guayaquil
      - DATABASE_URL=${DATABASE_URL}
      - DIRECT_URL=${DIRECT_URL}
      - JWT_SECRET=${JWT_SECRET:-super_secret_jwt_lojafac_2026}
      - CORS_ORIGIN=${CORS_ORIGIN:-*}
      - SMTP_HOST=${SMTP_HOST:-smtp.gmail.com}
      - SMTP_PORT=${SMTP_PORT:-465}
      - SMTP_SECURE=${SMTP_SECURE:-true}
      - SMTP_USER=${SMTP_USER}
      - SMTP_PASS=${SMTP_PASS}
    ports:
      - "4000:4000"

  # Frontend Web App Next.js
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: lojafac-frontend
    restart: always
    depends_on:
      - backend
    environment:
      - NODE_ENV=production
      - PORT=3000
      - TZ=America/Guayaquil
      - DATABASE_URL=${DATABASE_URL}
      - DIRECT_URL=${DIRECT_URL}
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-http://localhost:4000}
    ports:
      - "3000:3000"
